[package]
name = "cueforge-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Minimal reference UI and CLI launcher for manual testing."

[[bin]]
name = "cueforge"
path = "src/main.rs"

[dependencies]
cueforge-common = { path = "../common" }
cueforge-physics = { path = "../physics" }
cueforge-collision = { path = "../collision" }
cueforge-spin = { path = "../spin" }
cueforge-table = { path = "../table" }
cueforge-cue = { path = "../cue" }
cueforge-rules = { path = "../rules" }
cueforge-statistics = { path = "../statistics" }
cueforge-replay = { path = "../replay" }
cueforge-renderer = { path = "../renderer" }
cueforge-ai = { path = "../ai" }
cueforge-trainer = { path = "../trainer" }
cueforge-networking = { path = "../networking" }
